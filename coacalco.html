<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>Bait Plaza Coacalco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="redes.css?v=4">
</head>
<body data-ig="baitplazacoacalco" data-fb="baitplazacoacalco">
  <div class="stage" aria-hidden="true">
    <div class="ribbon"><span></span><span></span><span></span><span></span></div>
    <span class="orb orb-y"></span>
    <span class="orb orb-m"></span>
    <span class="orb orb-b"></span>
  </div>
  <main class="picker">
    <div class="logo-wrap">
      <img class="logo" src="logo-bait.gif" alt="Bait" width="108" height="108">
    </div>
    <p class="kicker">Síguenos</p>
    <h1>Plaza Coacalco</h1>
    <p class="lead">Elige la red y entra directo.</p>
    <div class="choices">
      <button class="choice choice-ig" id="open-ig" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4zm10 2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-5 3.2A3.8 3.8 0 1 1 8.2 12 3.8 3.8 0 0 1 12 8.2zm0 1.6A2.2 2.2 0 1 0 14.2 12 2.2 2.2 0 0 0 12 9.8zM17.4 6.4a1 1 0 1 1-1 1 1 1 0 0 1 1-1z"/></svg>
        <span>Instagram<small>@baitplazacoacalco</small></span>
      </button>
      <button class="choice choice-fb" id="open-fb" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.5 8.5V6.8c0-.7.5-1 1.2-1H17V3h-2.1C12.2 3 11 4.4 11 6.6v1.9H9v2.7h2V21h3.5v-9.8h2.3l.4-2.7h-2.7z"/></svg>
        <span>Facebook<small>Bait Plaza Coacalco</small></span>
      </button>
    </div>
  </main>
  <div class="launch" hidden>
    <div class="launch__card">
      <span class="launch__ring" aria-hidden="true"></span>
      <strong>Abriendo</strong>
    </div>
  </div>
  <script src="redes.js?v=4"></script>
</body>
</html>
